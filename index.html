<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png" />
    <meta name="apple-mobile-web-app-title" content="AI Turk" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css" />
    <title>AI Turk</title>
    <script>
      // 최초 로드 동기 반영 — React 마운트 전에 현재 userKey(#해시 우선)를 URL 해시·탭 타이틀에 부여.
      // 해시 선반영(pushState) 위치가 중요: React 마운트(useEffect)까지 미루면 직후 로딩에 즐겨찾기를 누른 경우
      // 브라우저가 변경 전 주소("/")를 즐겨찾기로 저장했었음 → HTML 파싱 시점에 즉시 pushState로 창 소멸.
      // 발급 규칙은 turk.tsx ensureLocalKey와 동일 슬롯(turk-user-key) — 순차실행이라 이중발급 없음.
      // 즐겨찾기·공유는 당존 값(주소/타이틀)을 Chrome이 사용 — manifest 오버라이드 기계장치는 제거됨 (261007,
      // 설치 기능 미사용: manifest 있으면 A2HS가 name/start_url을 덮어써 userid 세션이 잃게 됨).
      function uuidv4Safe() {
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
          var r = (Math.random() * 16) | 0;
          return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
        });
      }
      try {
        var h = location.hash.replace(/^#/, "").trim();
        try { if (h) h = decodeURIComponent(h); } catch (e) {}
        var k;
        if (h) {
          k = h; // 해시 우선 — 세션 오버라이드(저장 미사용, turk.tsx와 동일)
        } else {
          k = localStorage.getItem("turk-user-key");
          if (!k) { k = (crypto.randomUUID && crypto.randomUUID()) || uuidv4Safe(); localStorage.setItem("turk-user-key", k); }
          history.pushState(null, "", "#" + encodeURIComponent(k)); // 주소창·즐겨찾기에 userid 반영 (React 마운트 전)
        }
        if (k) {
          var id = /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(k) ? k.slice(0, 8) : k; // UUID형만 축약
          var t = "AI Turk #" + id; // 주소창 해시와 동일 표기 (ukey.ts userTitle과 통일)
          document.title = t;
          var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (m) m.setAttribute("content", t);
        }
      } catch (e) {}
    </script>
  </head>
  <body style="background:#000">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
