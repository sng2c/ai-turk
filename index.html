<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png" />
    <meta name="apple-mobile-web-app-title" content="Turk" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css" />
    <title>Turk</title>
    <script>
      // 최초 로드 동기 반영 — React 마운트 전에 현재 userKey(#해시 우선)를 URL 해시·localStorage에 부여.
      // URL 3상태 계약 (261010 — 새 대화=첫 페이지, 첫 메시지가 대화를 생성):
      //   "#new"                 → 드래프트 — 키 발급·저장·pushState 금지 (#new 그대로, localStorage 미접촉)
      //   "#<key>"               → 대화 — 해시 진입 = 마지막 대화 갱신 (localStorage만 — URL은 이미 해시 보유)
      //   해시 없음 + 저장 있음   → 마지막 대화 재개 — pushState로 주소 반영 (React 마운트 전 — 즐겨찾기 주소 신뢰)
      //   해시 없음 + 저장 없음   → 드래프트 — 자동 발급 제거 (발급은 첫 메시지 시점 — App.tsx handleSend)
      // 해시 선반영(pushState) 위치가 중요: React 마운트(useEffect)까지 미루면 직후 로딩에 즐겨찾기를 누른 경우
      // 브라우저가 변경 전 주소("/")를 즐겨찾기로 저장했었음 → HTML 파싱 시점에 즉시 pushState로 해소.
      // 즐겨찾기·공유는 당존 값(주소/타이틀)을 Chrome이 사용 — manifest 오버라이드 기계장치는 제거됨 (261007,
      // 설치 기능 미사용: manifest 있으면 A2HS가 name/start_url을 덮어써 userid 세션이 잃게 됨).
      try {
        var h = location.hash.replace(/^#/, "").trim();
        try { if (h) h = decodeURIComponent(h); } catch (e) {}
        if (h === "new") {
          // 드래프트 — 첫 메시지 전까지 대화 없음. 발급·저장·pushState 금지 (#new 그대로).
        } else if (h) {
          // 해시 우선 — 세션 오버라이드(딥링크·알림 클릭·드로어 전환)
          try { sessionStorage.removeItem("turk-ls-resume"); } catch (e) {} // 해시 진입 = 명증 진입 (푸시·북마크·드로어) — 서버 교정 대상 아님
          try { localStorage.setItem("turk-user-key", h); } catch (e) {} // 해시 진입 = 마지막 대화 갱신 → 루트 즐겨찾기가 최근 대화로 재개 (261010, ChatGPT식)
        } else {
          var k = localStorage.getItem("turk-user-key");
          if (k) {
            history.pushState(null, "", "#" + encodeURIComponent(k)); // 마지막 대화 재개 — 주소창·즐겨찾기에 userid 반영 (React 마운트 전)
            try { sessionStorage.setItem("turk-ls-resume", "1"); } catch (e) {} // 이 해시는 localStorage 자동 재개 결과 — 서버 대장(lastActiveAt) 교정 대상 (마르마크)
          }
          // 저장 없음 → 드래프트 — 루트 그대로, 발급 없음 (첫 메시지 시점에 발급)
        }
        // 탭 타이틀 "Turk" 고정 (261010 — 루트 즐겨찾기·채널명 타이틀 제거 — head의 meta도 고정값).
        // 대화 식별은 드로어 목록과 푸시 별명(Turk · <별명>)이 담당.
      } catch (e) {}
    </script>
  </head>
  <body style="background:#000">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
